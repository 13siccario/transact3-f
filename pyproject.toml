[project]
name = "transact3"
version = "0.1.0"
description = "transact3: cross-border FX, payment-rail routing and stablecoin cost anatomy into India (research code)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
forecast = ["lightgbm", "torch", "statsmodels", "arch", "scikit-learn"]
sim = ["gymnasium", "stable-baselines3"]
api = ["fastapi", "uvicorn"]
dev = ["pytest>=8"]

[project.scripts]
transact3 = "transact3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transact3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
